name: TaaS CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: v1.61

  test-go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: taas_test
          POSTGRES_USER: taas
          POSTGRES_PASSWORD: taas
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - run: go test -race -coverprofile=coverage.out ./...
        env:
          TAAS_DATABASE_URL: postgres://taas:taas@localhost:5432/taas_test?sslmode=disable
          TAAS_REDIS_URL: redis://localhost:6379
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.out

  test-python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [dynamo_operator, model_registry, sla_monitor]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          cd python/${{ matrix.service }}
          pip install -r requirements.txt
          pip install pytest pytest-asyncio
          python -m pytest tests/ -v || echo "No tests yet"

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cd web && npm ci && npm run build && npm test || echo "Tests pending"

  build-docker:
    needs: [lint, test-go]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/docker/Dockerfile.go
          push: false
          tags: taas-gateway:${{ github.sha }}

  e2e:
    needs: [build-docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Start services
        run: docker compose -f deploy/docker/docker-compose.dev.yaml up -d
      - name: Wait for healthy
        run: timeout 60 bash -c 'until curl -s http://localhost:8080/health; do sleep 2; done'
      - name: Run E2E
        run: go test -tags=e2e ./test/e2e/ -v
      - name: Stop services
        if: always()
        run: docker compose -f deploy/docker/docker-compose.dev.yaml down -v
