# TaaS Development Environment with LiteLLM Proxy
# Architecture: Client → LiteLLM Proxy → Dynamo Bridge → NVIDIA Dynamo
#
# Usage:
#   docker compose up -d                    # Start all services
#   docker compose up -d --build            # Rebuild and start
#   docker compose logs -f litellm          # Follow LiteLLM logs
#   docker compose exec postgres psql -U taas taas  # DB shell

version: "3.8"

services:
  # ─── Data Stores ────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: taas
      POSTGRES_PASSWORD: taas-dev-password
      POSTGRES_DB: taas
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taas"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  nats:
    image: nats:2-alpine
    command: ["-js"]   # Enable JetStream
    ports:
      - "4222:4222"
      - "8222:8222"    # Monitoring
    healthcheck:
      test: ["CMD", "nats-server", "--help"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ─── LiteLLM Proxy (API Gateway) ───────────────────────────────
  # Handles: API key auth, rate limiting, cost tracking, model routing
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    ports:
      - "4000:4000"
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    environment:
      LITELLM_MASTER_KEY: sk-litellm-master-dev-key
      DATABASE_URL: postgresql://taas:taas-dev-password@postgres:5432/taas
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ""
      LITELLM_WEBHOOK_SECRET: webhook-dev-secret
    command: ["--config", "/app/config.yaml", "--port", "4000", "--detailed_debug"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ─── TaaS Gateway (Management API) ─────────────────────────────
  # Handles: Auth, Token CRUD, Model CRUD, Billing API, Dashboard, LiteLLM webhooks
  taas-gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    ports:
      - "8080:8080"
    environment:
      GATEWAY_PORT: "8080"
      DATABASE_URL: postgresql://taas:taas-dev-password@postgres:5432/taas
      REDIS_URL: redis://redis:6379
      NATS_URL: nats://nats:4222
      JWT_SIGNING_KEY: dev-jwt-secret-change-me
      JWT_EXPIRY_SECONDS: "3600"
      REFRESH_TOKEN_EXPIRY_DAYS: "7"
      DYNAMO_FRONTEND_URL: http://mock-dynamo:9090
      CORS_ALLOWED_ORIGINS: "*"
      # LiteLLM integration
      LITELLM_ENABLED: "true"
      LITELLM_PROXY_URL: http://litellm:4000
      LITELLM_MASTER_KEY: sk-litellm-master-dev-key
      LITELLM_WEBHOOK_SECRET: webhook-dev-secret
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_started
      litellm:
        condition: service_healthy

  # ─── TaaS Dynamo Bridge ────────────────────────────────────────
  # Sits between LiteLLM and NVIDIA Dynamo. Injects tenant headers + publishes usage.
  taas-dynamo-bridge:
    build:
      context: .
      dockerfile: Dockerfile.dynamo-bridge
    ports:
      - "8090:8090"
    environment:
      DYNAMO_BRIDGE_PORT: "8090"
      DYNAMO_FRONTEND_URL: http://mock-dynamo:9090
      NATS_URL: nats://nats:4222
      BRIDGE_INTERNAL_KEY: internal-bridge-key
    depends_on:
      nats:
        condition: service_started

  # ─── Mock Dynamo (for development) ─────────────────────────────
  # Simulates NVIDIA Dynamo Frontend for local dev without GPU
  mock-dynamo:
    build:
      context: .
      dockerfile: Dockerfile.mock-dynamo
    ports:
      - "9090:9090"
    environment:
      MOCK_DYNAMO_PORT: "9090"

volumes:
  postgres_data:
