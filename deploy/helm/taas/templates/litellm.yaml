{{- if .Values.litellm.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "taas.fullname" . }}-litellm-config
  labels:
    {{- include "taas.serviceLabels" (dict "service" "litellm" "root" .) | nindent 4 }}
data:
  config.yaml: |
    model_list: []
    general_settings:
      master_key: "{{ .Values.secrets.litellmMasterKey }}"
      database_url: "postgresql://taas:{{ .Values.secrets.dbPassword | urlquery }}@{{ include "taas.postgresqlHost" . }}.{{ .Release.Namespace }}.svc.cluster.local:5432/litellm"
      store_model_in_db: true
    litellm_settings:
      set_verbose: false
      drop_params: true
      cache: false
    router_settings:
      routing_strategy: "least-busy"
      num_retries: 2
      timeout: 120
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "taas.fullname" . }}-litellm
  labels:
    {{- include "taas.serviceLabels" (dict "service" "litellm" "root" .) | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "taas.name" . }}-litellm
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "taas.serviceLabels" (dict "service" "litellm" "root" .) | nindent 8 }}
    spec:
      containers:
        - name: litellm
          image: {{ .Values.litellm.image.repository }}:{{ .Values.litellm.image.tag }}
          imagePullPolicy: {{ .Values.litellm.image.pullPolicy }}
          args:
            - "--config"
            - {{ .Values.litellm.configPath | quote }}
            - "--port"
            - {{ .Values.litellm.service.port | quote }}
          env:
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: taas-secrets
                  key: litellm-master-key
            - name: LITELLM_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: taas-secrets
                  key: litellm-webhook-secret
          ports:
            - name: http
              containerPort: {{ .Values.litellm.service.port }}
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 180
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          volumeMounts:
            - name: litellm-config
              mountPath: {{ .Values.litellm.configPath }}
              subPath: config.yaml
      volumes:
        - name: litellm-config
          configMap:
            name: {{ include "taas.fullname" . }}-litellm-config
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "taas.fullname" . }}-litellm
  labels:
    {{- include "taas.serviceLabels" (dict "service" "litellm" "root" .) | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.litellm.service.port }}
      targetPort: http
  selector:
    app.kubernetes.io/name: {{ include "taas.name" . }}-litellm
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
