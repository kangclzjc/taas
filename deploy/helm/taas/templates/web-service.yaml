{{- if .Values.web.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "taas.fullname" . }}-web
  labels:
    {{- include "taas.serviceLabels" (dict "service" "web" "root" .) | nindent 4 }}
spec:
  type: {{ .Values.web.service.type }}
  ports:
    - port: {{ .Values.web.service.port }}
      targetPort: http
      protocol: TCP
      name: http
      {{- if and (eq .Values.web.service.type "NodePort") .Values.web.service.nodePort }}
      nodePort: {{ .Values.web.service.nodePort }}
      {{- end }}
  selector:
    app.kubernetes.io/name: {{ include "taas.name" . }}-web
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
