version: '3.9'

# Full local development environment with TaaS gateway and all dependencies.
# Run: make docker-up

services:
  postgres:
    image: postgres:16-alpine
    container_name: taas-postgres
    environment:
      POSTGRES_DB: taas
      POSTGRES_USER: taas
      POSTGRES_PASSWORD: taas
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../../migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taas"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: taas-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  nats:
    image: nats:2.10-alpine
    container_name: taas-nats
    command: ["-js"]
    ports:
      - "4222:4222"
      - "8222:8222"

  gateway:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    container_name: taas-gateway
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_started
    environment:
      TAAS_PORT: 8080
      TAAS_DATABASE_URL: postgres://taas:taas@postgres:5432/taas?sslmode=disable
      TAAS_REDIS_URL: redis://redis:6379
      TAAS_NATS_URL: nats://nats:4222
      TAAS_JWT_SIGNING_KEY: dev-secret-key-change-in-production
      TAAS_DYNAMO_FRONTEND_URL: http://dynamo-mock:8090

  prometheus:
    image: prom/prometheus:v2.54.0
    container_name: taas-prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus.dev.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"

  grafana:
    image: grafana/grafana:11.2.0
    container_name: taas-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  jaeger:
    image: jaegertracing/all-in-one:1.60
    container_name: taas-jaeger
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

volumes:
  pgdata:
  prometheus_data:
  grafana_data:
