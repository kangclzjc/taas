# DynamoGraphDeployment — aggregated vLLM (no DGDR / no profiling). Namespace `dynamo`.
# Based on https://github.com/ai-dynamo/dynamo/blob/v1.0.1/examples/backends/vllm/deploy/agg.yaml
#
# Requires: hf-token-secret in namespace (optional for public models).
#   kubectl create secret generic hf-token-secret --from-literal=HF_TOKEN="$HF_TOKEN" -n dynamo
#
# Apply:
#   kubectl apply -f deploy/extras/nvidia-dynamo-dgd-vllm-agg-dynamo-ns.yaml
#
# Match image tag to your dynamo-platform / NGC (vllm-runtime, not dynamo-frontend).
apiVersion: nvidia.com/v1alpha1
kind: DynamoGraphDeployment
metadata:
  name: vllm-agg-taas
  namespace: dynamo
spec:
  backendFramework: vllm
  services:
    Frontend:
      componentType: frontend
      replicas: 1
      envFromSecret: hf-token-secret
      extraPodSpec:
        mainContainer:
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.0.1
          env:
            - name: DYN_DISCOVERY_BACKEND
              value: kubernetes
    VllmDecodeWorker:
      componentType: worker
      replicas: 1
      envFromSecret: hf-token-secret
      resources:
        limits:
          gpu: "1"
      extraPodSpec:
        tolerations:
          - key: nvidia.com/gpu
            operator: Exists
            effect: NoSchedule
        mainContainer:
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.0.1
          env:
            - name: DYN_DISCOVERY_BACKEND
              value: kubernetes
          workingDir: /workspace/examples/backends/vllm
          command:
            - python3
            - -m
            - dynamo.vllm
          args:
            - --model
            - Qwen/Qwen3-0.6B
